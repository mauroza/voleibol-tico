<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voleibol Tico</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2333; font-family: system-ui, sans-serif; }
      .hud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); color: #fff; background: rgba(0, 0, 0, 0.55);
             padding: 8px 16px; border-radius: 8px; white-space: pre; text-align: center; font-size: 16px; }
      #help { position: fixed; bottom: 10px; left: 12px; color: #ccd; font-size: 13px; }
      button { font: inherit; cursor: pointer; }

      .menu { position: fixed; inset: 0; margin: auto; width: min(360px, calc(100% - 32px)); height: fit-content; display: grid; gap: 12px;
              background: rgba(10, 14, 24, 0.92); color: #fff; padding: 24px; border-radius: 14px; border: 1px solid #ffffff22; }
      .menu h1 { margin: 0 0 4px; font-size: 26px; text-align: center; letter-spacing: 0.5px; }
      .menu label { display: grid; gap: 4px; font-size: 13px; color: #aab; }
      .menu select { font: inherit; padding: 8px; border-radius: 8px; background: #1c2436; color: #fff; border: 1px solid #ffffff33; }
      .menu button { margin-top: 8px; padding: 12px; border: 0; border-radius: 10px; background: #ffe14d; color: #111; font-weight: 700; font-size: 17px; }

      .decision { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
                  background: rgba(10, 14, 24, 0.88); color: #fff; padding: 12px 14px; border-radius: 12px; border: 1px solid #ffe14d55; display: none; }
      .decision-title { font-weight: 700; color: #ffe14d; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-size: 13px; }
      .decision-buttons, .decision-zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
      .decision-zones { grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
      .decision button { padding: 8px 10px; border-radius: 8px; border: 1px solid #ffffff33; background: #1c2436; color: #fff; text-align: left; }
      .decision button.chosen { background: #ffe14d; color: #111; border-color: #ffe14d; font-weight: 700; }
      .meter { position: relative; height: 16px; margin-top: 10px; border-radius: 8px; background: #2a3247; overflow: hidden; cursor: pointer; }
      .meter-zone { position: absolute; top: 0; bottom: 0; right: 0; }
      .meter-zone.good { background: #3d8b5a; }
      .meter-zone.perfect { background: #5dff8f; }
      .meter-marker { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 8px #fff; }
      .decision-hint { margin-top: 6px; font-size: 12px; color: #aab; }
      .feedback { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: 44px; font-weight: 900; color: #fff;
                  text-shadow: 0 3px 12px #000; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
      .feedback[data-timing="perfect"] { color: #5dff8f; }
      .feedback[data-timing="good"] { color: #ffe14d; }
      .feedback[data-timing="bad"] { color: #ff6b6b; }
      .speedlines { position: fixed; inset: 0; pointer-events: none; }
      .replay-badge { position: fixed; top: 96px; left: 16px; padding: 6px 12px; border-radius: 6px; background: #ce1126; color: #fff;
                      font-weight: 900; letter-spacing: 2px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="help">1–6: elegir · ESPACIO: timing · F: velocidad x4</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
